name: Setup workspace
description: Install pnpm + Node 24 and the frozen workspace dependencies.

# Shared by every CI job so the install recipe lives in ONE place. pnpm's version
# is read from the root package.json `packageManager` field (pnpm@9.15.9), so it
# never drifts from what developers run locally.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
