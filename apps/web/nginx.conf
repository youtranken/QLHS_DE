# On-prem HTTP (:80 → mapped to :18080) plus local HTTPS on :5173 using the real
# *.pmh.com.vn cert, so the container app reuses the PMH ID SSO redirect already
# registered for https://qlhs.pmh.com.vn:5173.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SSE (2.1): the ticket stream must not be buffered or timed out, or the
  # browser gets updates in bursts — or not at all. Must precede the /api/ block.
  location /api/events/ {
    proxy_pass http://api:3000/events/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}

server {
  listen 5173 ssl;
  server_name qlhs.pmh.com.vn;
  root /usr/share/nginx/html;

  ssl_certificate /certs/fullchain.pem;
  ssl_certificate_key /certs/private.key;

  # SSE (2.1): unbuffered, long-lived. Must precede the /api/ block.
  location /api/events/ {
    proxy_pass http://api:3000/events/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Public edge is HTTPS even though the upstream hop is plain HTTP.
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri /index.html;
  }
}
