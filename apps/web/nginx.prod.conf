# Prod (CỤM edge): web chỉ chạy HTTP :80 — EDGE nginx lo TLS bằng cert chung *.pmh.com.vn.
# KHÔNG còn `listen 5173 ssl` / cert riêng (đó là di sản kiểu máy-lẻ). Mount đè lên
# /etc/nginx/conf.d/default.conf qua docker-compose.prod.yml (dev vẫn dùng nginx.conf gốc).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SSE (2.1): KHÔNG buffer, timeout dài. Phải đứng TRƯỚC /api/.
  # Edge đã gửi X-Forwarded-Proto=https; giữ nguyên https (backend chỉ tới qua edge).
  location /api/events/ {
    proxy_pass http://api:3000/events/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri /index.html;
  }
}
